<div class="container">

<!-- Contact Form -->

<div class="form-box" id="formBox">

<h2>Adoption Registration</h2>

<form id="adoptForm">

<label>Full Name</label>
<input type="text" id="name">
<span class="error" id="nameError"></span>

<label>Email Address</label>
<input type="email" id="email">
<span class="error" id="emailError"></span>

<label>Phone Number</label>
<input type="text" id="phone">
<span class="error" id="phoneError"></span>

<label>Address</label>
<input type="text" id="address">
<span class="error" id="addressError"></span>

<label>Pet Preference</label>
<input type="text" id="pet">
<span class="error" id="petError"></span>

<label>Adoption Appointment Date</label>

<input
type="text"
id="date"
placeholder="Select Appointment Date">

<span class="error" id="dateError"></span>

<label>Message</label>

<textarea id="message"
placeholder="Write your message here..."></textarea>

<span class="error" id="messageError"></span>

<button type="submit">

<i class="fa-solid fa-paw"></i>

Submit Application

</button>

</form>

</div>



<!-- Thank You Panel -->

<div class="info-box" id="thankBox">

<img
src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=300"
alt="Happy Pet"
class="thank-image">

<div class="check">

<i class="fa-solid fa-circle-check"></i>

</div>

<h1>Thank You!</h1>

<p>

Your adoption application has been submitted successfully.

We will contact you soon.

</p>

</div>
